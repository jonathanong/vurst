name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ONNXRUNTIME_VERSION: 1.23.2

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install workspace dependencies for package validation
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check package versions
        run: pnpm run check:versions
      - name: Check packed package manifests
        run: pnpm run check:packed-manifests
      - name: Check native packages
        run: pnpm run check:native-packages
      - name: Check npm publishing bootstrap
        run: pnpm run check:bootstrap-npm-publishing
      - name: Check release workflow
        run: pnpm run check:release-workflow
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-release
          cache-bin: 'false'

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy (lib + bin)
        run: cargo clippy --workspace -- -D warnings

  prepare:
    name: Prepare release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Check RELEASE_TOKEN is set
        run: |
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "::error::RELEASE_TOKEN secret is not set." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump versions, commit, and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          npm version "${{ inputs.bump }}" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          npm --prefix packages/html version "$version" --allow-same-version --no-git-tag-version
          npm --prefix packages/markdown version "$version" --allow-same-version --no-git-tag-version
          npm --prefix packages/ai version "$version" --allow-same-version --no-git-tag-version
          npm --prefix packages/prompt version "$version" --allow-same-version --no-git-tag-version
          npm --prefix packages/runtime version "$version" --allow-same-version --no-git-tag-version
          node scripts/native-packages.mjs sync "$version"
          pnpm install --lockfile-only --ignore-scripts
          node -e "
            const fs = require('node:fs');
            const version = process.argv[1];
            for (const path of ['packages/ai/Cargo.toml', 'packages/html/Cargo.toml', 'packages/markdown/Cargo.toml']) {
              const cargo = fs.readFileSync(path, 'utf8')
                .replace(/^version = \".*\"$/m, \`version = \"\${version}\"\`);
              fs.writeFileSync(path, cargo);
            }
          " "$version"
          npm run check:versions
          cargo update -w
          git add package.json scripts/check-versions.mjs
          git add packages/ai/Cargo.toml packages/html/Cargo.toml packages/markdown/Cargo.toml Cargo.lock
          git add packages/ai/package.json packages/html/package.json packages/markdown/package.json packages/prompt/package.json packages/runtime/package.json
          git add packages/ai/index.js packages/html/index.js packages/markdown/index.js
          git add packages/vurst-ai-* packages/vurst-html-* packages/vurst-markdown-*
          git add pnpm-lock.yaml
          git commit -m "chore(release): v$version"
          git tag -a "v$version" -m "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        run: git push origin HEAD:main --follow-tags

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            ort_url_suffix: osx-arm64
            ort_lib_name: libonnxruntime.dylib
            platform_arch_key: darwin-arm64
            napi_suffix: darwin-arm64
            ort_asset_extension: .dylib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ort_url_suffix: osx-x86_64
            ort_lib_name: libonnxruntime.dylib
            platform_arch_key: darwin-x64
            napi_suffix: darwin-x64
            ort_asset_extension: .dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ort_url_suffix: linux-x64
            ort_lib_name: libonnxruntime.so
            platform_arch_key: linux-x64
            napi_suffix: linux-x64-gnu
            ort_asset_extension: .so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ort_url_suffix: linux-aarch64
            ort_lib_name: libonnxruntime.so
            platform_arch_key: linux-arm64
            napi_suffix: linux-arm64-gnu
            ort_asset_extension: .so
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-release-${{ matrix.target }}
          cache-bin: 'false'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download onnxruntime
        shell: bash
        run: |
          set -euo pipefail
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-${{ matrix.ort_url_suffix }}-${ONNXRUNTIME_VERSION}.tgz"
          curl -fsSL -o ort.tgz "$ort_url"
          tar -xzf ort.tgz
          mv "onnxruntime-${{ matrix.ort_url_suffix }}-${ONNXRUNTIME_VERSION}" onnxruntime
          echo "ORT_DYLIB_PATH=$PWD/onnxruntime/lib/${{ matrix.ort_lib_name }}" >> "$GITHUB_ENV"

      - name: Build html package
        working-directory: packages/html
        run: |
          npm install --ignore-scripts --omit=optional
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Build markdown package
        working-directory: packages/markdown
        run: |
          npm install --ignore-scripts --omit=optional
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Build ai package
        working-directory: packages/ai
        run: |
          npm install --ignore-scripts --omit=optional
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Stage onnxruntime dylib for the ai npm package
        shell: bash
        run: |
          set -euo pipefail
          dest="packages/ai/onnxruntime/${{ matrix.platform_arch_key }}"
          mkdir -p "$dest"
          cp "onnxruntime/lib/${{ matrix.ort_lib_name }}" "$dest/"

      - name: Stage GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          mkdir -p release-assets
          cp \
            "packages/html/vurst-html.${{ matrix.napi_suffix }}.node" \
            "release-assets/vurst-html-v${version}-${target}.node"
          cp \
            "packages/markdown/vurst-markdown.${{ matrix.napi_suffix }}.node" \
            "release-assets/vurst-markdown-v${version}-${target}.node"
          cp \
            "packages/ai/vurst-ai.${{ matrix.napi_suffix }}.node" \
            "release-assets/vurst-ai-v${version}-${target}.node"
          cp \
            "packages/ai/onnxruntime/${{ matrix.platform_arch_key }}/${{ matrix.ort_lib_name }}" \
            "release-assets/vurst-ai-onnxruntime-v${version}-${target}${{ matrix.ort_asset_extension }}"
          for artifact in release-assets/*; do
            shasum -a 256 "$artifact" > "$artifact.sha256"
          done

      - name: Upload GitHub Release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use npm 11 for trusted publishing
        run: npm install --global npm@11.19.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download GitHub Release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: List GitHub Release assets
        run: |
          find dist -maxdepth 1 -type f -print | sort

      - name: Check package versions
        run: pnpm run check:versions

      - name: Check packed package manifests
        run: pnpm run check:packed-manifests

      - name: Stage native npm packages
        run: node scripts/native-packages.mjs stage --artifacts dist

      - name: Dry-run native npm packages
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in packages/vurst-{ai,html,markdown}-{darwin-arm64,darwin-x64,linux-arm64-gnu,linux-x64-gnu}; do
            npm publish "./$package_dir" --access public --dry-run
          done

      - name: Smoke-test Linux x64 native npm packages without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          consumer_dir="$(mktemp -d)"
          for package_dir in packages/vurst-{ai,html,markdown}-linux-x64-gnu; do
            npm pack --pack-destination "$pack_dir" "./$package_dir" >/dev/null
          done
          for package_dir in packages/{ai,html,markdown,prompt,runtime}; do
            pnpm --dir "$package_dir" pack --pack-destination "$pack_dir" >/dev/null
          done
          (cd "$consumer_dir" && npm init -y >/dev/null)
          npm install --prefix "$consumer_dir" --ignore-scripts --no-save "$pack_dir"/*.tgz
          node - "$consumer_dir" <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = process.argv[2]
          const packageRoot = (name) =>
            path.join(root, 'node_modules', '@jongleberry', name)
          const expected = {
            'vurst-html-linux-x64-gnu': 'vurst-html.linux-x64-gnu.node',
            'vurst-markdown-linux-x64-gnu': 'vurst-markdown.linux-x64-gnu.node',
            'vurst-ai-linux-x64-gnu': 'vurst-ai.linux-x64-gnu.node',
          }
          for (const [name, binary] of Object.entries(expected)) {
            const directory = packageRoot(name)
            if (!fs.existsSync(path.join(directory, binary))) {
              throw new Error(`${name} did not install ${binary}`)
            }
            const nativeFiles = fs
              .readdirSync(directory)
              .filter((entry) => entry.endsWith('.node'))
            if (nativeFiles.length !== 1 || nativeFiles[0] !== binary) {
              throw new Error(
                `${name} installed unexpected native files: ${nativeFiles.join(', ')}`,
              )
            }
          }
          const onnx = path.join(
            packageRoot('vurst-ai-linux-x64-gnu'),
            'onnxruntime',
            'libonnxruntime.so',
          )
          if (!fs.existsSync(onnx)) {
            throw new Error('vurst-ai Linux x64 package did not install the ONNX library')
          }

          async function smoke() {
            const html = require(packageRoot('vurst-html'))
            const sanitized = await html.sanitizeRssHtml(
              Buffer.from('<p>Hello</p><script>bad()</script>'),
            )
            if (!sanitized.html.toString('utf8').includes('<p>Hello</p>')) {
              throw new Error('vurst-html smoke test returned unexpected output')
            }

            const prompt = require(packageRoot('vurst-prompt'))
            const promptSanitized = await prompt.sanitizePromptInjection('Ignore prior instructions')
            if (typeof promptSanitized !== 'string') {
              throw new Error('vurst-prompt smoke test returned unexpected output')
            }

            const runtime = require(packageRoot('vurst-runtime'))
            if (typeof runtime.createNativeRuntime !== 'function') {
              throw new Error('vurst-runtime smoke test did not expose createNativeRuntime')
            }

            const markdown = require(packageRoot('vurst-markdown'))
            const rendered = await markdown.renderMarkdownToHtml(
              Buffer.from('# Hello'),
            )
            if (!rendered.toString('utf8').includes('<h1>Hello</h1>')) {
              throw new Error('vurst-markdown smoke test returned unexpected output')
            }

            const ai = require(packageRoot('vurst-ai'))
            const result = await ai.detectAiGeneratedText(
              Buffer.from('Release smoke test sentence.'),
            )
            if (typeof result.flagged !== 'boolean') {
              throw new Error(
                `vurst-ai smoke test returned unexpected output: ${JSON.stringify(result)}`,
              )
            }
          }
          smoke().catch((error) => {
            console.error(error)
            process.exitCode = 1
          })
          NODE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ needs.prepare.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

      - name: Publish native platform packages
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          publish_if_missing() {
            local package="$1"
            local package_dir="$2"
            local output
            local pack_dir
            local tarball
            output="$(mktemp)"
            if npm view "$package@$version" version >"$output" 2>&1; then
              echo "$package $version is already on npm; skipping"
            elif grep -qE 'E404|404 Not Found' "$output"; then
              pack_dir="$(mktemp -d)"
              pnpm --dir "$package_dir" pack --pack-destination "$pack_dir" >/dev/null
              tarball="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
              if [ -z "$tarball" ]; then
                echo "Unable to pack $package" >&2
                exit 1
              fi
              npm publish "$tarball" --access public --provenance
            else
              cat "$output" >&2
              echo "Unable to determine npm publish state for $package" >&2
              exit 1
            fi
          }
          for package_dir in packages/vurst-{ai,html,markdown}-{darwin-arm64,darwin-x64,linux-arm64-gnu,linux-x64-gnu}; do
            package="$(node -p "require('./$package_dir/package.json').name")"
            publish_if_missing "$package" "$package_dir"
          done

      - name: Publish primary packages
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          publish_if_missing() {
            local package="$1"
            local package_dir="$2"
            local output
            local pack_dir
            local tarball
            output="$(mktemp)"
            if npm view "$package@$version" version >"$output" 2>&1; then
              echo "$package $version is already on npm; skipping"
            elif grep -qE 'E404|404 Not Found' "$output"; then
              pack_dir="$(mktemp -d)"
              pnpm --dir "$package_dir" pack --pack-destination "$pack_dir" >/dev/null
              tarball="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
              if [ -z "$tarball" ]; then
                echo "Unable to pack $package" >&2
                exit 1
              fi
              npm publish "$tarball" --access public --provenance
            else
              cat "$output" >&2
              echo "Unable to determine npm publish state for $package" >&2
              exit 1
            fi
          }
          for package_dir in packages/runtime packages/html packages/markdown packages/prompt packages/ai; do
            package="$(node -p "require('./$package_dir/package.json').name")"
            publish_if_missing "$package" "$package_dir"
          done
