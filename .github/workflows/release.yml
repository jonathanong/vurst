name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump type
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ONNXRUNTIME_VERSION: 1.23.2

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install workspace dependencies for package validation
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check package versions
        run: pnpm run check:versions
      - name: Check packed package manifests
        run: pnpm run check:packed-manifests
      - name: Check native installer
        run: pnpm run check:native-installer
      - name: Check release workflow
        run: pnpm run check:release-workflow
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-release
          cache-bin: 'false'

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy (lib + bin)
        run: cargo clippy --workspace -- -D warnings

  prepare:
    name: Prepare release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Check RELEASE_TOKEN is set
        run: |
          if [ -z "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "::error::RELEASE_TOKEN secret is not set." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump versions, commit, and tag
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          npm version "${{ inputs.bump }}" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          npm --prefix packages/html version "$version" --allow-same-version --no-git-tag-version
          npm --prefix packages/markdown version "$version" --allow-same-version --no-git-tag-version
          npm --prefix packages/ai version "$version" --allow-same-version --no-git-tag-version
          npm --prefix packages/prompt version "$version" --allow-same-version --no-git-tag-version
          npm --prefix packages/runtime version "$version" --allow-same-version --no-git-tag-version
          node -e "
            const fs = require('node:fs');
            const version = process.argv[1];
            for (const path of ['packages/ai/Cargo.toml', 'packages/html/Cargo.toml', 'packages/markdown/Cargo.toml']) {
              const cargo = fs.readFileSync(path, 'utf8')
                .replace(/^version = \".*\"$/m, \`version = \"\${version}\"\`);
              fs.writeFileSync(path, cargo);
            }
          " "$version"
          npm run check:versions
          cargo update -w
          git add package.json scripts/check-versions.mjs
          git add packages/ai/Cargo.toml packages/html/Cargo.toml packages/markdown/Cargo.toml Cargo.lock
          git add packages/ai/package.json packages/html/package.json packages/markdown/package.json packages/prompt/package.json packages/runtime/package.json
          git commit -m "chore(release): v$version"
          git tag -a "v$version" -m "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        run: git push origin HEAD:main --follow-tags

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            ort_url_suffix: osx-arm64
            ort_lib_name: libonnxruntime.dylib
            platform_arch_key: darwin-arm64
            napi_suffix: darwin-arm64
            ort_asset_extension: .dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ort_url_suffix: linux-x64
            ort_lib_name: libonnxruntime.so
            platform_arch_key: linux-x64
            napi_suffix: linux-x64-gnu
            ort_asset_extension: .so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ort_url_suffix: linux-aarch64
            ort_lib_name: libonnxruntime.so
            platform_arch_key: linux-arm64
            napi_suffix: linux-arm64-gnu
            ort_asset_extension: .so
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-release-${{ matrix.target }}
          cache-bin: 'false'
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download onnxruntime
        shell: bash
        run: |
          set -euo pipefail
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-${{ matrix.ort_url_suffix }}-${ONNXRUNTIME_VERSION}.tgz"
          curl -fsSL -o ort.tgz "$ort_url"
          tar -xzf ort.tgz
          mv "onnxruntime-${{ matrix.ort_url_suffix }}-${ONNXRUNTIME_VERSION}" onnxruntime
          echo "ORT_DYLIB_PATH=$PWD/onnxruntime/lib/${{ matrix.ort_lib_name }}" >> "$GITHUB_ENV"

      - name: Build html package
        working-directory: packages/html
        run: |
          npm install --ignore-scripts
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Build markdown package
        working-directory: packages/markdown
        run: |
          npm install --ignore-scripts
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Build ai package
        working-directory: packages/ai
        run: |
          npm install --ignore-scripts
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Stage onnxruntime dylib for the ai npm package
        shell: bash
        run: |
          set -euo pipefail
          dest="packages/ai/onnxruntime/${{ matrix.platform_arch_key }}"
          mkdir -p "$dest"
          cp "onnxruntime/lib/${{ matrix.ort_lib_name }}" "$dest/"

      - name: Stage GitHub Release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          mkdir -p release-assets
          cp \
            "packages/html/vurst-html.${{ matrix.napi_suffix }}.node" \
            "release-assets/vurst-html-v${version}-${target}.node"
          cp \
            "packages/markdown/vurst-markdown.${{ matrix.napi_suffix }}.node" \
            "release-assets/vurst-markdown-v${version}-${target}.node"
          cp \
            "packages/ai/vurst-ai.${{ matrix.napi_suffix }}.node" \
            "release-assets/vurst-ai-v${version}-${target}.node"
          cp \
            "packages/ai/onnxruntime/${{ matrix.platform_arch_key }}/${{ matrix.ort_lib_name }}" \
            "release-assets/vurst-ai-onnxruntime-v${version}-${target}${{ matrix.ort_asset_extension }}"
          for artifact in release-assets/*; do
            shasum -a 256 "$artifact" > "$artifact.sha256"
          done

      - name: Upload GitHub Release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download GitHub Release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: List GitHub Release assets
        run: |
          find dist -maxdepth 1 -type f -print | sort

      - name: Check package versions
        run: pnpm run check:versions

      - name: Check packed package manifests
        run: pnpm run check:packed-manifests

      - name: Smoke-test GitHub Release installers
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          consumer_dir="$(mktemp -d)"
          pnpm --dir packages/html pack --pack-destination "$pack_dir" >/dev/null
          pnpm --dir packages/markdown pack --pack-destination "$pack_dir" >/dev/null
          pnpm --dir packages/ai pack --pack-destination "$pack_dir" >/dev/null
          npm init --prefix "$consumer_dir" -y >/dev/null
          export VURST_RELEASE_BASE_URL
          VURST_RELEASE_BASE_URL="$(
            node -e "console.log(require('node:url').pathToFileURL(process.argv[1]).href)" \
              "$PWD/dist"
          )"
          npm install --prefix "$consumer_dir" --no-save "$pack_dir"/*.tgz
          node - "$consumer_dir" <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const root = process.argv[2]
          const packageRoot = (name) =>
            path.join(root, 'node_modules', '@jongleberry', name)
          const expected = {
            'vurst-html': 'vurst-html.linux-x64-gnu.node',
            'vurst-markdown': 'vurst-markdown.linux-x64-gnu.node',
            'vurst-ai': 'vurst-ai.linux-x64-gnu.node',
          }
          for (const [name, binary] of Object.entries(expected)) {
            const directory = packageRoot(name)
            if (!fs.existsSync(path.join(directory, binary))) {
              throw new Error(`${name} did not install ${binary}`)
            }
            const nativeFiles = fs
              .readdirSync(directory)
              .filter((entry) => entry.endsWith('.node'))
            if (nativeFiles.length !== 1 || nativeFiles[0] !== binary) {
              throw new Error(
                `${name} installed unexpected native files: ${nativeFiles.join(', ')}`,
              )
            }
          }
          const onnx = path.join(
            packageRoot('vurst-ai'),
            'onnxruntime',
            'linux-x64',
            'libonnxruntime.so',
          )
          if (!fs.existsSync(onnx)) {
            throw new Error('vurst-ai did not install the Linux x64 ONNX library')
          }

          async function smoke() {
            const html = require(packageRoot('vurst-html'))
            const sanitized = await html.sanitizeRssHtml(
              Buffer.from('<p>Hello</p><script>bad()</script>'),
            )
            if (!sanitized.html.toString('utf8').includes('<p>Hello</p>')) {
              throw new Error('vurst-html smoke test returned unexpected output')
            }

            const markdown = require(packageRoot('vurst-markdown'))
            const rendered = await markdown.renderMarkdownToHtml(
              Buffer.from('# Hello'),
            )
            if (!rendered.toString('utf8').includes('<h1>Hello</h1>')) {
              throw new Error('vurst-markdown smoke test returned unexpected output')
            }

            const ai = require(packageRoot('vurst-ai'))
            const result = await ai.detectAiGeneratedText(
              Buffer.from('Release smoke test sentence.'),
            )
            if (typeof result.flagged !== 'boolean') {
              throw new Error(
                `vurst-ai smoke test returned unexpected output: ${JSON.stringify(result)}`,
              )
            }
          }
          smoke().catch((error) => {
            console.error(error)
            process.exitCode = 1
          })
          NODE

      - name: Show npm publish state
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          for package in \
            "@jongleberry/vurst-runtime" \
            "@jongleberry/vurst-html" \
            "@jongleberry/vurst-markdown" \
            "@jongleberry/vurst-prompt" \
            "@jongleberry/vurst-ai"
          do
            if npm view "$package@$version" version >/dev/null 2>&1; then
              echo "$package $version is already on npm and will be skipped"
            else
              echo "$package $version is not on npm and will be published"
            fi
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ needs.prepare.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes
          fi

      - name: Publish @jongleberry/vurst-runtime
        working-directory: packages/runtime
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          if npm view "@jongleberry/vurst-runtime@$version" version >/dev/null 2>&1; then
            echo "@jongleberry/vurst-runtime $version is already on npm; skipping"
          else
            pnpm publish --access public --provenance --no-git-checks
          fi

      - name: Publish @jongleberry/vurst-html
        working-directory: packages/html
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          if npm view "@jongleberry/vurst-html@$version" version >/dev/null 2>&1; then
            echo "@jongleberry/vurst-html $version is already on npm; skipping"
          else
            pnpm publish --access public --provenance --no-git-checks
          fi

      - name: Publish @jongleberry/vurst-markdown
        working-directory: packages/markdown
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          if npm view "@jongleberry/vurst-markdown@$version" version >/dev/null 2>&1; then
            echo "@jongleberry/vurst-markdown $version is already on npm; skipping"
          else
            pnpm publish --access public --provenance --no-git-checks
          fi

      - name: Publish @jongleberry/vurst-prompt
        working-directory: packages/prompt
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          if npm view "@jongleberry/vurst-prompt@$version" version >/dev/null 2>&1; then
            echo "@jongleberry/vurst-prompt $version is already on npm; skipping"
          else
            pnpm publish --access public --provenance --no-git-checks
          fi

      - name: Publish @jongleberry/vurst-ai
        working-directory: packages/ai
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          if npm view "@jongleberry/vurst-ai@$version" version >/dev/null 2>&1; then
            echo "@jongleberry/vurst-ai $version is already on npm; skipping"
          else
            pnpm publish --access public --provenance --no-git-checks
          fi
