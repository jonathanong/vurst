name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install workspace dependencies for package validation
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check package versions
        run: pnpm run check:versions
      - name: Check packed package manifests
        run: pnpm run check:packed-manifests
      - name: Check native packages
        run: pnpm run check:native-packages
      - name: Check npm publishing bootstrap
        run: pnpm run check:bootstrap-npm-publishing
      - name: Check release workflow
        run: pnpm run check:release-workflow
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (lib + bin)
        run: cargo clippy --workspace -- -D warnings

      - name: Run Clippy (tests, warnings only)
        run: cargo clippy --workspace --tests

      - name: Download onnxruntime (for slop detection at test time)
        run: |
          set -euo pipefail
          curl -fsSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz
          tar -xzf ort.tgz
          mv onnxruntime-linux-x64-1.23.2 onnxruntime
          echo "ORT_DYLIB_PATH=$PWD/onnxruntime/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Run Rust tests with coverage (html)
        run: |
          mkdir -p coverage
          cargo llvm-cov nextest -p vurst-html-node --all-features \
            --fail-under-lines 100 \
            --ignore-filename-regex 'src/lib\.rs' \
            --lcov --output-path coverage/lcov-html.info

      - name: Run Rust tests with coverage (markdown)
        run: |
          cargo llvm-cov nextest -p vurst-markdown-node --all-features \
            --fail-under-lines 100 \
            --ignore-filename-regex 'src/lib\.rs' \
            --lcov --output-path coverage/lcov-markdown.info

      - name: Run Rust tests with coverage (ai)
        run: |
          cargo llvm-cov nextest -p vurst-ai-node --all-features \
            --fail-under-lines 100 \
            --ignore-filename-regex 'src/lib\.rs' \
            --lcov --output-path coverage/lcov-ai.info

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov-html.info,coverage/lcov-markdown.info,coverage/lcov-ai.info
          fail_ci_if_error: false
          use_oidc: true

      - name: Install node deps (html)
        working-directory: packages/html
        run: npm install --ignore-scripts --omit=optional

      - name: Build native module (html, debug)
        working-directory: packages/html
        run: npm run build:debug

      - name: Run Node smoke tests (html)
        working-directory: packages/html
        run: npm test

      - name: Install node deps (markdown)
        working-directory: packages/markdown
        run: npm install --ignore-scripts --omit=optional

      - name: Build native module (markdown, debug)
        working-directory: packages/markdown
        run: npm run build:debug

      - name: Run Node smoke tests (markdown)
        working-directory: packages/markdown
        run: npm test

      - name: Install node deps (ai)
        working-directory: packages/ai
        run: npm install --ignore-scripts --omit=optional

      - name: Build native module (ai, debug)
        working-directory: packages/ai
        run: npm run build:debug

      - name: Stage onnxruntime dylib next to the ai .node
        run: |
          set -euo pipefail
          mkdir -p packages/ai/onnxruntime/linux-x64
          cp onnxruntime/lib/libonnxruntime.so packages/ai/onnxruntime/linux-x64/libonnxruntime.so

      - name: Run Node smoke tests (ai)
        working-directory: packages/ai
        run: npm test

      - name: Install node deps (runtime)
        working-directory: packages/runtime
        run: npm install

      - name: Run Node tests (runtime)
        working-directory: packages/runtime
        run: node --test __test__/*.test.mjs

  build-smoke:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-ci-${{ matrix.target }}

      - name: Install node deps and build (html)
        working-directory: packages/html
        run: |
          npm install --ignore-scripts --omit=optional
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Install node deps and build (markdown)
        working-directory: packages/markdown
        run: |
          npm install --ignore-scripts --omit=optional
          npx napi build --platform --release --target ${{ matrix.target }}

      - name: Install node deps and build (ai)
        working-directory: packages/ai
        run: |
          npm install --ignore-scripts --omit=optional
          npx napi build --platform --release --target ${{ matrix.target }}
